<style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estructura CSS Grid rígida */
        body {
            display: grid;
            /* Renglones: Topbar (55px), Contenido principal (1fr), Footer (50px) */
            grid-template-rows: 55px 1fr 50px;
            /* Columnas: Sidebar (80px), Main (Restante) */
            grid-template-columns: 80px 1fr;
            
            /* Mapeamos la distribución espacial */
            grid-template-areas: 
                "topbar topbar"
                "sidebar main"
                "footer footer";
        }

        /* Asignamos las etiquetas HTML a sus zonas del Grid */
        .topbar {
            grid-area: topbar;
            height: 55px;
            background-color: #1e293b;
            color: white;
            z-index: 100;
        }

        .sidebar {
            grid-area: sidebar;
            width: 80px;
            background-color: #0f172a;
            color: white;
        }

        .main {
            grid-area: main;
            overflow-y: auto; /* Permite scroll vertical únicamente dentro del main */
            padding: 20px;
            background-color: #f8fafc;
        }

        .footer {
            grid-area: footer;
            height: 50px;
            background-color: #0f172a;
            color: #94a3b8;
        }
    </style>
